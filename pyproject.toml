[build-system]
requires      = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name        = "hiberno-english-parser"
version     = "1.0.0"
description = "Rule-based and GenAI parsing pipelines for A Dictionary of Hiberno-English"
readme      = "README.md"
requires-python = ">=3.9"
license     = { text = "MIT" }

dependencies = [
    "anthropic>=0.25.0",
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
vis  = ["matplotlib>=3.8.0", "seaborn>=0.13.0"]
test = ["pytest>=8.0.0"]
dev  = ["hiberno-english-parser[vis,test]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
